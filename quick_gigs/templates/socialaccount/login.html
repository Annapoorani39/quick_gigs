{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continue with Google - SkillMatch AI</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* small fallback styling if needed */
    .auth-wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .auth-card { width: min(520px, 100%); border-radius: 18px; padding: 28px; backdrop-filter: blur(10px); }
    .auth-title { font-size: 28px; margin: 0 0 10px; }
    .auth-sub { opacity: .85; margin: 0 0 18px; line-height:1.5; }
    .auth-actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; }
    .btn-basic { padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.15); color: inherit; cursor:pointer; }
    .btn-basic:hover { background: rgba(0,0,0,.22); }
  </style>
  <link rel="stylesheet" href="{% static 'css/modern-ui.css' %}">
</head>

<body>
  <!-- Optional: reuse your animated bg if your CSS expects it -->
  <div class="animated-bg">
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
  </div>

  <div class="auth-wrap">
    <div class="auth-card glass-card">
      <h1 class="auth-title">Continue with Google</h1>
      <p class="auth-sub">
        You’re about to sign in using your Google account.
      </p>

      <form method="post">
        {% csrf_token %}

        <!-- This hidden redirect field is used by allauth when present -->
        {% if redirect_field_value %}
          <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
        {% endif %}

        <div class="auth-actions">
          <!-- Primary action: POST = continue -->
          <button type="submit" class="google-btn">
            <svg class="google-icon" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue
          </button>

          <!-- Secondary action -->
          <a class="btn-basic" href="{% url 'account_login' %}">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
