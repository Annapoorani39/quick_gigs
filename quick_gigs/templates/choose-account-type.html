{% extends 'base.html' %}

{% block content %}
<div class="form-card">
  <div class="card-header">
    <h2 class="card-title">Complete your profile</h2>
    <p class="card-subtitle">Please choose an account type to continue.</p>
  </div>
  <form method="post" action="{% url 'complete_profile' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url }}">
    {% if errors %}
    <div class="alert alert-danger" role="alert">
      <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
    </div>
    {% endif %}
    <div class="form-group">
      <label for="full_name">Full name</label>
      <input type="text" class="form-control" id="full_name" name="full_name" value="{{ full_name }}" maxlength="200" required>
    </div>
    <div class="form-group">
      <label for="phone_number">Phone number</label>
      <input type="tel" class="form-control" id="phone_number" name="phone_number" value="{{ phone_number }}" maxlength="15" required>
    </div>
    <div class="form-group">
      <label>Account Type</label>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="account_type" id="worker" value="worker" {% if selected_account_type == 'worker' %}checked{% endif %} required>
        <label class="form-check-label" for="worker">Service Provider (Worker)</label>
        
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="account_type" id="employer" value="employer" {% if selected_account_type == 'employer' %}checked{% endif %}>
        <label class="form-check-label" for="employer">Client (Employer) — can post jobs</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="account_type" id="both" value="both" {% if selected_account_type == 'both' %}checked{% endif %}>
        <label class="form-check-label" for="both">Both</label>
      </div>
    </div>











    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save and Continue</button>
      <a href="{{ cancel_url }}" class="btn btn-secondary" style="text-decoration:none;display:inline-flex;align-items:center;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
